<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>До / После</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  .cmp {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 100vw;
    aspect-ratio: 1920 / 1066;
    max-height: 100vh;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 12px;
    user-select: none;
    touch-action: pan-y;
    cursor: ew-resize;
    --pos: 50%;
  }
  .cmp img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .cmp .after { clip-path: inset(0 0 0 var(--pos)); }
  .line {
    position: absolute; top: 0; bottom: 0;
    left: var(--pos);
    width: 2px; margin-left: -1px;
    background: #fff;
  }
  .handle {
    position: absolute; top: 50%; left: var(--pos);
    width: 44px; height: 44px; margin: -22px 0 0 -22px;
    border-radius: 50%;
    background: #f0188c;
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
    display: grid; place-items: center;
    box-sizing: border-box;
    border: 3px solid #fff; padding: 0; cursor: ew-resize;
  }
  .handle:focus-visible { outline: 3px solid #f0f; outline-offset: 2px; }
  .handle svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
  <div class="cmp" id="cmp">
    <img class="before" src="slider-1.png" alt="До" draggable="false">
    <img class="after" src="slider-2.png" alt="После" draggable="false">
    <div class="line"></div>
    <button class="handle" id="handle" role="slider" aria-label="Сравнение до и после" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
      <svg viewBox="0 0 24 24"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6"/></svg>
    </button>
  </div>
<script>
(function () {
  var box = document.getElementById('cmp');
  var handle = document.getElementById('handle');
  var dragging = false;

  function set(pct) {
    pct = Math.max(0, Math.min(100, pct));
    box.style.setProperty('--pos', pct + '%');
    handle.setAttribute('aria-valuenow', Math.round(pct));
  }
  function fromEvent(e) {
    var r = box.getBoundingClientRect();
    set((e.clientX - r.left) / r.width * 100);
  }
  box.addEventListener('pointerdown', function (e) {
    dragging = true;
    box.setPointerCapture(e.pointerId);
    fromEvent(e);
  });
  box.addEventListener('pointermove', function (e) { if (dragging) fromEvent(e); });
  box.addEventListener('pointerup', function () { dragging = false; });
  box.addEventListener('pointercancel', function () { dragging = false; });
  handle.addEventListener('keydown', function (e) {
    var cur = parseFloat(handle.getAttribute('aria-valuenow'));
    if (e.key === 'ArrowLeft') { set(cur - 5); e.preventDefault(); }
    if (e.key === 'ArrowRight') { set(cur + 5); e.preventDefault(); }
  });
})();
</script>
</body>
</html>
